name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build
        run: npm run build

      - name: Deploy to production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --project tienda-online-cf3c0 --token "$FIREBASE_TOKEN"
          echo "✅ Deploy completado en: https://tienda-online-cf3c0.web.app"

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --project tienda-online-cf3c0 --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Preview deploy completado"